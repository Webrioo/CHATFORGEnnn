<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chat with ChatForge</title>
<meta name="theme-color" content="#f7f9ff">
<link rel="icon" href="favicon.svg">
<style>
  :root{--bg:#f7f9ff;--ink:#14183a;--blue:#4f5bff;--mint:#36d6a4;--line:#d9def5;--card:#fff;--muted:#5b6188}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1226;--ink:#eef0ff;--blue:#6b76ff;--line:#2a2f57;--card:#1a1e3d;--muted:#a3a9d6}}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card)}
  header svg{width:48px;height:auto;flex:none}
  .who{flex:1;min-width:0}
  .who b{display:block;font-size:17px}
  .who span{font-size:13px;color:var(--muted)}
  .who span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mint);margin-right:6px}
  .back{color:var(--blue);font-weight:600;text-decoration:none;font-size:14px;padding:8px 4px}
  main{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:12px;max-width:820px;width:100%;margin:0 auto}
  .msg{max-width:min(85%,560px);padding:10px 14px;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere;animation:in .2s ease-out}
  .bot{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
  .me{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:4px}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .typing{display:flex;gap:5px;padding:14px}
  .typing i{width:8px;height:8px;border-radius:50%;background:var(--muted);animation:dot 1s infinite}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes dot{0%,80%,100%{opacity:.3}40%{opacity:1}}
  .chips{display:flex;flex-wrap:wrap;gap:8px;align-self:flex-start}
  .chip,.book{font:inherit;font-weight:600;font-size:14px;border-radius:999px;padding:8px 14px;cursor:pointer}
  .chip{background:var(--card);color:var(--blue);border:1.5px solid var(--blue)}
  .chip:hover{background:var(--blue);color:#fff}
  .book{background:var(--mint);color:#06281d;border:0;align-self:flex-start;padding:11px 18px}
  form{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--line);background:var(--card)}
  .bar{display:flex;gap:10px;max-width:820px;width:100%;margin:0 auto}
  input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:999px;padding:12px 18px}
  input:focus{outline:none;border-color:var(--blue)}
  button.send{font:inherit;font-weight:700;background:var(--blue);color:#fff;border:0;border-radius:999px;padding:0 22px;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  :focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<header>
  <svg viewBox="8 0 104 82" aria-hidden="true">
    <line x1="60" y1="20" x2="60" y2="9" stroke="#14183a" stroke-width="3" stroke-linecap="round"/>
    <circle cx="60" cy="7" r="5" fill="#36d6a4" stroke="#14183a" stroke-width="2.5"/>
    <rect x="8" y="38" width="10" height="20" rx="5" fill="#4f5bff" stroke="#14183a" stroke-width="2.5"/>
    <rect x="102" y="38" width="10" height="20" rx="5" fill="#4f5bff" stroke="#14183a" stroke-width="2.5"/>
    <rect x="18" y="20" width="84" height="58" rx="26" fill="#fff" stroke="#14183a" stroke-width="3"/>
    <rect x="27" y="29" width="66" height="40" rx="18" fill="#14183a"/>
    <ellipse cx="46" cy="45" rx="5.5" ry="7" fill="#36d6a4"/><ellipse cx="74" cy="45" rx="5.5" ry="7" fill="#36d6a4"/>
    <circle cx="36" cy="57" r="4" fill="#ff8fab" opacity=".85"/><circle cx="84" cy="57" r="4" fill="#ff8fab" opacity=".85"/>
    <path d="M52 57q8 7 16 0" stroke="#36d6a4" stroke-width="3" fill="none" stroke-linecap="round"/>
  </svg>
  <div class="who"><b>ChatForge Assistant</b><span>Online, ask me anything</span></div>
  <a class="back" href="/">Back to site</a>
</header>

<main id="log" aria-live="polite"></main>

<form id="form">
  <div class="bar">
    <input id="input" type="text" placeholder="Type your question..." maxlength="500" autocomplete="off" aria-label="Your message">
    <button class="send" type="submit">Send</button>
  </div>
</form>

<script>
  // Where booking requests are emailed (same inbox as your sheet's Contact row).
  var OWNER_EMAIL = "hamzewso@gmail.com";
  var CHIPS = ["What do you build?", "How much does it cost?", "How long does it take?", "Book a consultation"];
  var GREETING = "Hi! I'm the ChatForge assistant. Ask me about our chatbots, pricing or timelines, or book a consultation.";

  var log = document.getElementById("log"), input = document.getElementById("input"),
      form = document.getElementById("form"), sendBtn = form.querySelector(".send");
  var history = [];
  try { history = JSON.parse(sessionStorage.getItem("cf-chat") || "[]"); } catch (e) {}

  function esc(s){return s.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  function fmt(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")}
  function scroll(){log.scrollTop=log.scrollHeight}
  function save(){try{sessionStorage.setItem("cf-chat",JSON.stringify(history.slice(-30)))}catch(e){}}

  var BOOKING_RE = /\[\[BOOKING\]\]([\s\S]*?)\[\[\/BOOKING\]\]/;

  function addMsg(role, text){
    var m = BOOKING_RE.exec(text), booking = null;
    if (m) { try { booking = JSON.parse(m[1]); } catch (e) {} text = text.replace(BOOKING_RE, "").trim(); }
    var d = document.createElement("div");
    d.className = "msg " + (role === "user" ? "me" : "bot");
    d.innerHTML = fmt(text);
    log.appendChild(d);
    if (booking) {
      var b = document.createElement("button");
      b.className = "book"; b.textContent = "Send booking by email";
      b.onclick = function(){
        var body = "New consultation booking\n\nName: " + booking.name + "\nContact: " + booking.contact +
                   "\nService: " + booking.service + "\nPreferred date/time: " + booking.datetime;
        location.href = "mailto:" + OWNER_EMAIL + "?subject=" + encodeURIComponent("Consultation booking: " + booking.name) +
                        "&body=" + encodeURIComponent(body);
      };
      log.appendChild(b);
    }
    scroll();
  }

  function removeChips(){var c=document.getElementById("chips");if(c)c.remove()}

  async function send(text){
    text = text.trim(); if (!text) return;
    removeChips(); addMsg("user", text);
    history.push({role:"user", content:text}); save();
    input.value = ""; sendBtn.disabled = true;
    var t = document.createElement("div"); t.className = "msg bot typing"; t.innerHTML = "<i></i><i></i><i></i>";
    log.appendChild(t); scroll();
    var reply;
    try {
      var r = await fetch("/api/chat", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({messages:history})});
      var data = await r.json();
      reply = data.reply || "";
      if (!r.ok || !reply) throw new Error("bad reply");
    } catch (e) {
      reply = "Sorry, I can't connect right now. Please email " + OWNER_EMAIL + " and we'll reply soon.";
    }
    t.remove();
    history.push({role:"assistant", content:reply}); save();
    addMsg("assistant", reply);
    sendBtn.disabled = false; input.focus();
  }

  form.addEventListener("submit", function(e){e.preventDefault(); send(input.value)});

  if (history.length) {
    history.forEach(function(m){addMsg(m.role, m.content)});
  } else {
    addMsg("assistant", GREETING);
    var c = document.createElement("div"); c.className = "chips"; c.id = "chips";
    CHIPS.forEach(function(q){
      var b = document.createElement("button"); b.className = "chip"; b.type = "button"; b.textContent = q;
      b.onclick = function(){send(q)}; c.appendChild(b);
    });
    log.appendChild(c);
  }
</script>
</body>
</html>
